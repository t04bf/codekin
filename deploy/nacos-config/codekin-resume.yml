# Nacos Data ID: codekin-resume.yml; Group: CODEKIN; 类型: YAML。
server:
  port: ${CODEKIN_RESUME_PORT:8085}

spring:
  datasource:
    url: jdbc:mysql://${CODEKIN_MYSQL_HOST}:${CODEKIN_MYSQL_PORT:3306}/${CODEKIN_MYSQL_DATABASE:codekin}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${CODEKIN_MYSQL_USER}
    password: ${CODEKIN_MYSQL_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'

codekin:
  resume-pdf:
    assets-directory: ${CODEKIN_RESUME_PDF_ASSETS_DIRECTORY:}
    executable-path: ${CODEKIN_RESUME_PDF_EXECUTABLE_PATH:}
    timeout-millis: ${CODEKIN_RESUME_PDF_TIMEOUT_MILLIS:30000}
    max-concurrent: ${CODEKIN_RESUME_PDF_MAX_CONCURRENT:2}

dubbo:
  application:
    name: codekin-resume
    qos-enable: false
    serialize-check-status: STRICT
  registry:
    address: nacos://${CODEKIN_NACOS_SERVER_ADDR:127.0.0.1:8848}
    username: ${CODEKIN_NACOS_USERNAME:nacos}
    password: ${CODEKIN_NACOS_PASSWORD}
    group: CODEKIN_DUBBO
    register-mode: interface
    use-as-config-center: false
    use-as-metadata-center: false
  consumer:
    check: false
    timeout: 10000
    retries: 0
