# 仅保留连接配置中心所必需的引导信息；业务配置见 deploy/nacos-config。
spring:
  application:
    name: codekin-gateway
  config:
    import:
      - "nacos:codekin-common.yml?group=CODEKIN&refreshEnabled=false"
      - "nacos:codekin-gateway.yml?group=CODEKIN&refreshEnabled=false"
  cloud:
    nacos:
      server-addr: ${CODEKIN_NACOS_SERVER_ADDR:localhost:8848}
      username: ${CODEKIN_NACOS_USERNAME:nacos}
      password: ${CODEKIN_NACOS_PASSWORD}
